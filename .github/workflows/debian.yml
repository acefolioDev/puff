name: Debian package
on: [push, pull_request, workflow_dispatch]
jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y g++ make pkg-config libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libsecret-1-dev libpq-dev libsqlite3-dev dpkg-dev desktop-file-utils xvfb xauth dbus-x11 python3
      - run: make test
      - run: xvfb-run -a dbus-run-session -- make ui-test
      - run: make deb
      - run: dpkg -i dist/*.deb && puff --version
      - uses: actions/upload-artifact@v4
        with:
          name: puff-debian
          path: dist/*.deb
